# Builds the app and publishes it to GitHub Pages on every push to main.
# Live at https://silverneostar.github.io/nte-team-builder/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Once a week, so songs newly added to the room's YouTube playlists show up.
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Exact package versions from package-lock.json when it exists, and no
      # install scripts, so a hijacked package can't run code during the build.
      - run: if [ -f package-lock.json ]; then npm ci --ignore-scripts; else npm install --ignore-scripts; fi
      # The Tea Room's whole YouTube playlists: list each of their songs (titles and
      # ids only). If YouTube can't be read, the room plays them as one row instead.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet yt-dlp && python tools/expand_playlists.py || echo "Playlists left as one row each"
      # The site lives under /nte-team-builder/, so asset paths need that prefix.
      - run: npm run build -- --base=/nte-team-builder/
      # File sizes of the built scripts and styles, shown as notes on the run.
      - name: Report bundle sizes
        run: |
          cd dist/assets
          # One note listing every file, largest first (runs keep only 10 notes per step).
          list=$(for f in *.js *.css; do echo "$(stat -c%s "$f") $f $(gzip -c "$f" | wc -c)"; done | sort -rn | awk '{printf "%s: %s bytes, %s gzipped%%0A", $2, $1, $3}')
          echo "::notice title=Bundle sizes::$list"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
