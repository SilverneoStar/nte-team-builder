name: Format code (Prettier)

# Run by hand from the Actions tab: formats the code with Prettier, checks the
# site still builds, then commits the result to main.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
      - run: npm run format
      - run: npm run build -- --base=/nte-team-builder/
      - name: Commit if anything changed
        id: commit
        run: |
          if git diff --quiet; then echo "Already formatted"; echo "changed=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Format code with Prettier"
          echo "changed=yes" >> "$GITHUB_OUTPUT"
      - name: Push to main
        if: steps.commit.outputs.changed == 'yes'
        run: git push origin HEAD:main
      - name: Deploy the formatted site
        # Pushes made with this token don't start other workflows, so deploy by hand.
        if: steps.commit.outputs.changed == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main --repo "$GITHUB_REPOSITORY"
