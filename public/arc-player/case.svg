<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 600" width="680" height="600"><defs>
  <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#3a3d45"/><stop offset=".08" stop-color="#2a2c33"/><stop offset="1" stop-color="#1c1d22"/>
  </linearGradient>
  <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#25272e"/><stop offset=".5" stop-color="#30333b"/><stop offset="1" stop-color="#1e2026"/>
  </linearGradient>
  <linearGradient id="win" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#2e3442"/><stop offset="1" stop-color="#171a22"/>
  </linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset=".35" stop-color="#fff" stop-opacity="0"/>
    <stop offset=".75" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".06"/>
  </linearGradient>
  <radialGradient id="discSheen" cx=".35" cy=".25" r=".9"><stop offset="0" stop-color="#fff" stop-opacity=".10"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <radialGradient id="hubG" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#3a3d46"/><stop offset="1" stop-color="#0d0e12"/></radialGradient>
  <pattern id="grille" width="9" height="8" patternUnits="userSpaceOnUse"><rect x="1.5" y="1.5" width="5" height="4" rx="1" fill="#e8c53a"/></pattern>
  <filter id="drop" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity=".55"/></filter>
  <clipPath id="winClip"><path d="M96,62 H386 V316 L340,362 H96 Q86,362 86,352 V72 Q86,62 96,62 Z"/></clipPath>
</defs><g filter="url(#drop)">
  <!-- case body: chamfered bottom-right corner, notch for the hub on the bottom edge -->
  <path id="caseBody" d="M84,36 H452 Q474,36 474,58 V300 L372,428 H84 Q62,428 62,406 V58 Q62,36 84,36 Z" fill="url(#body)"/>
  <path d="M84,36 H452 Q474,36 474,58 V300 L372,428 H84 Q62,428 62,406 V58 Q62,36 84,36 Z"
        fill="none" stroke="#4a4e59" stroke-width="2"/>
  <!-- right spine -->
  <path d="M398,44 H450 Q466,44 466,60 V294 L398,306 Z" fill="url(#spine)"/>
  <line x1="398" y1="46" x2="398" y2="304" stroke="#15161a" stroke-width="2"/>
  <rect x="408" y="70" width="22" height="16" rx="2" fill="#e8c53a"/>
  <rect x="411" y="73" width="16" height="4" rx="1" fill="#fff4b0" opacity=".7"/>
  <rect x="440" y="62" width="10" height="34" rx="3" fill="#191a1f" stroke="#3d404a" stroke-width="1.5"/>
  <rect x="414" y="118" width="10" height="120" rx="5" fill="#15161a" stroke="#3d404a" stroke-width="1.5"/>
  <rect x="434" y="128" width="16" height="70" rx="4" fill="#2a2d35" stroke="#3d404a" stroke-width="1.2"/>
  <line x1="438" y1="140" x2="446" y2="140" stroke="#4a4e59" stroke-width="2"/>
  <line x1="438" y1="150" x2="446" y2="150" stroke="#4a4e59" stroke-width="2"/>
  <line x1="438" y1="160" x2="446" y2="160" stroke="#4a4e59" stroke-width="2"/>
  <rect x="440" y="214" width="8" height="12" rx="2" fill="#e23a3a"/><rect x="441.5" y="216" width="3" height="4" rx="1" fill="#ffb3b3"/>
  <rect x="412" y="250" width="38" height="7" rx="3.5" fill="#15161a"/>
  <rect x="412" y="264" width="38" height="7" rx="3.5" fill="#15161a"/>
  <text x="430" y="54" font-family="monospace" font-size="9" fill="#8a8f9c" text-anchor="middle">ε.ω.</text>
  <!-- window (artwork goes here) -->
  <path d="M94,56 H392 V318 L342,368 H94 Q80,368 80,354 V70 Q80,56 94,56 Z" fill="#101115"/>
  <g clip-path="url(#winClip)">
    <rect id="artwork" x="86" y="62" width="300" height="300" fill="url(#win)"/>
    
  </g>
  
  <!-- bottom strip: speaker grille and side vents -->
  <rect x="94" y="382" width="150" height="28" rx="4" fill="#15161a"/>
  <rect x="98" y="387" width="142" height="18" fill="url(#grille)"/>
  <rect x="70" y="388" width="6" height="18" rx="3" fill="#15161a"/>
  <rect x="80" y="388" width="6" height="18" rx="3" fill="#15161a"/>
</g>
</svg>